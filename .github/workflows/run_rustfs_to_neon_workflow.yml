name: Run Data Pipeline (GitHub CSV -> DuckDB -> Neon)

on:
  workflow_dispatch:
  schedule:
   - cron: '0 1 * * *'  # 01:00 UTC = 08:00 WIB

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dlt[postgres]"
          pip install duckdb

      - name: Run Data Pipeline
        env:
          DESTINATION__POSTGRES__CREDENTIALS: ${{ secrets.NEON_DB_URL }}
        run: |
          python pipeline.py
