name: Run rustfs_to_neon pipeline from pipeline.py

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  DESTINATION__POSTGRES__CREDENTIALS__DATABASE: neondb
  DESTINATION__POSTGRES__CREDENTIALS__DRIVERNAME: postgresql
  DESTINATION__POSTGRES__CREDENTIALS__HOST: ep-purple-hill-ao3jwaqh.c-2.ap-southeast-1.aws.neon.tech
  DESTINATION__POSTGRES__CREDENTIALS__PORT: '5432'
  DESTINATION__POSTGRES__CREDENTIALS__USERNAME: neondb_owner
  DESTINATION__POSTGRES__CREDENTIALS__SSLMODE: require
  DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${{ secrets.DESTINATION__POSTGRES__CREDENTIALS__PASSWORD }}
  
  SOURCES__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${{ secrets.SOURCES__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID }}
  SOURCES__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.SOURCES__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY }}

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install -r requirements_github_action.txt

      - name: Run pipeline script
        run: python 'pipeline.py'
