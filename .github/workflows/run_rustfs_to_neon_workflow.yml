name: Run rustfs_to_neon pipeline from pipeline.py
'on':
  schedule:
  - cron: 0 */6 * * *
  workflow_dispatch: null
env:
  DESTINATION__POSTGRES__CREDENTIALS__DATABASE: neondb
  DESTINATION__POSTGRES__CREDENTIALS__USERNAME: neondb_owner
  DESTINATION__POSTGRES__CREDENTIALS__HOST: ep-purple-hill-ao3jwaqh.c-2.ap-southeast-1.aws.neon.tech
  DESTINATION__POSTGRES__CREDENTIALS__PORT: '5432'
  DESTINATION__POSTGRES__CREDENTIALS__CONNECT_TIMEOUT: '15'
  SOURCES__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: rustfsadmin
  DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${{ secrets.DESTINATION__POSTGRES__CREDENTIALS__PASSWORD }}
  SOURCES__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.SOURCES__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY }}
jobs:
  maybe_skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
    - id: skip_check
      uses: fkirc/skip-duplicate-actions@v5
      with:
        concurrent_skipping: always
        skip_after_successful_duplicate: 'false'
        do_not_skip: '[]'
  run_pipeline:
    needs: maybe_skip
    if: needs.maybe_skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@v3
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11.x
    - uses: syphar/restore-virtualenv@v1
      id: cache-virtualenv
      with:
        requirement_files: requirements_github_action.txt
    - uses: syphar/restore-pip-download-cache@v1
      if: steps.cache-virtualenv.outputs.cache-hit != 'true'
    - run: pip install -r requirements_github_action.txt
      if: steps.cache-virtualenv.outputs.cache-hit != 'true'
    - name: Run pipeline script
      run: python 'pipeline.py'
