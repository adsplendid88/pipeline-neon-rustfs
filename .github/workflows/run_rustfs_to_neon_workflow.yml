name: Run rustfs_to_neon pipeline from pipeline.py

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  DESTINATION__POSTGRES__CREDENTIALS__DATABASE: neondb
  DESTINATION__POSTGRES__CREDENTIALS__DRIVERNAME: postgresql
  DESTINATION__POSTGRES__CREDENTIALS__HOST: ep-purple-hill-ao3jwaqh.c-2.ap-southeast-1.aws.neon.tech
  DESTINATION__POSTGRES__CREDENTIALS__PORT: '5432'
  DESTINATION__POSTGRES__CREDENTIALS__USERNAME: neondb_owner
  DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${{ secrets.DESTINATION__POSTGRES__CREDENTIALS }}
  SOURCES__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: rustfsadmin
  SOURCES__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${{ secrets.SOURCES__FILESYSTEM__CREDENTIALS }}

jobs:
  maybe_skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: always
          skip_after_successful_duplicate: 'false'
          do_not_skip: '[]'
          
  run_pipeline:
    needs: maybe_skip
    if: needs.maybe_skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install -r requirements_github_action.txt

      - name: Run pipeline script
        run: python 'pipeline.py' 
